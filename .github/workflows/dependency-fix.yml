name: Fix dependency audit

on:
  push:
    branches:
      - september-dev

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply compatible audit fixes
        run: npm audit fix

      - name: Verify high severity audit is clean
        run: npm audit --audit-level=high

      - name: Commit lockfile updates
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No dependency changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "Resolve dependency audit findings"
          git push origin HEAD:september-dev
