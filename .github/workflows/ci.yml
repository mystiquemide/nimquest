name: NimQuest CI

on:
  pull_request:
  push:
    branches:
      - main
      - september-dev

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build:web

      - name: Run unit and API tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run browser smoke tests
        run: npm run test:browser

      - name: Check Worker bundle
        run: npm run worker:check

      - name: Run Worker integration tests
        shell: bash
        run: |
          npx wrangler d1 migrations apply nimquest --local
          npx wrangler dev --port 8790 --local > /tmp/nimquest-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8790/health >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:8790/health >/dev/null; then
            cat /tmp/nimquest-worker.log
            exit 1
          fi
          npm run test:worker-integration

      - name: Run QA CLI
        run: node cli/index.mjs qa --ci

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: artifacts/qa/
          if-no-files-found: ignore
